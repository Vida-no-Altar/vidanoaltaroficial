<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#262523" />
    <title>Página não encontrada | Vida no Altar</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 32px 20px;
        background: #262523;
        color: #f2ebdf;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }
      main { width: min(100%, 680px); }
      p { max-width: 590px; margin: 18px 0 0; color: #d8cdbd; }
      .eyebrow { color: #d9b752; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; }
      h1 { margin: 10px 0 0; color: #fffaf0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.4rem, 8vw, 4.8rem); line-height: 1.05; }
      a {
        min-height: 48px;
        width: fit-content;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 28px;
        border: 1px solid #d9b752;
        border-radius: 8px;
        padding: 0 20px;
        background: #d9b752;
        color: #262523;
        font-weight: 800;
        text-decoration: none;
      }
      a:hover { background: #f2e1ac; border-color: #f2e1ac; }
      a:focus-visible { outline: 3px solid #f2e1ac; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">Erro 404</span>
      <h1>Página não encontrada</h1>
      <p>O endereço acessado não existe ou não está mais disponível. Volte ao site oficial do Vida no Altar para continuar.</p>
      <a href="https://vidanoaltaroficial.com.br/">Voltar ao início</a>
    </main>
  </body>
</html>
